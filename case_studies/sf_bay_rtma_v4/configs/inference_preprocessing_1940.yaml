# FULL-RECORD inference config for the v4 recipe, 1940-01-01 -> 2026-10-01.
#
# FIVE input channels (lr_gust comes from the gust variable PAIR's low_res key,
# not a predictor block). Trimmed to the five so no other source's shorter span
# intersects the time axis away. Use with INFER_CONFIG=<this file>.
#
# The v4 ERA5 files are used as delivered: no staging, no border fill. Training
# (preprocessing.yaml) reads the very same files, so inputs are consistent between
# training and inference by construction.

sources:
  lr_u:
    file: ERA5_eastward_wind_1940_2026_UTM.nc
    source_var: null
  lr_v:
    file: ERA5_northward_wind_1940_2026_UTM.nc
    source_var: null
  lr_gust:
    file: ERA5_wind_gust_1940_2026_UTM.nc
    source_var: null
  lr_cloud:
    file: ERA5_cloud_area_fraction_1940_2026_UTM.nc
    source_var: null
  static_terrain:
    file: RTMA_SFbay_2p5km_surface_height_static_UTM10.nc
    source_var: null
start_date: '1940-01-01'
end_date: '2026-10-02'
interpolation_method: linear
compression_level: 1
physical_bounds:
  lr_u:
    min: -100
    max: 100
  lr_v:
    min: -100
    max: 100
  lr_gust:
    min: 0
    max: 150
  lr_cloud:
    min: -0.1
    max: 1.1
  static_terrain:
    min: -500
    max: 5000
